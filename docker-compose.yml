
services:

  auth-db:
    image: postgres:15-alpine
    container_name: bank-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - bank-network

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - bank-network

  deposit-db:
    image: postgres:15-alpine
    container_name: bank-postgres-deposit
    environment:
      POSTGRES_DB: deposit_db
      POSTGRES_USER: deposit_user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deposit_user -d deposit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - bank-network

  config-server:
    build: ./infrastructure/config-server
    container_name: bank-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  eureka-server:
    build: ./infrastructure/eureka-server
    container_name: bank-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://bank-config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - bank-network

  api-gateway:
    build: ./api-gateway
    container_name: bank-gateway
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/realms/bank-realm
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bank-keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://auth-db:5432/auth_db
      - KC_DB_USERNAME=user
      - KC_DB_PASSWORD=password
      - KC_HTTP_PORT=8081
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=false
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./keycloak-theme/bank:/opt/keycloak/themes/bank:ro
    networks:
      - bank-network

  deposit-service:
    build: ./deposit-service
    container_name: bank-deposit-service
    ports:
      - "8082:8082"
    depends_on:
      deposit-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bank-network

  web-service:
    build: ./web-service
    container_name: bank-web
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - bank-network

volumes:
  postgres_auth_data:
  postgres_deposit_data:
  redis_data:

networks:
  bank-network:
    driver: bridge
version: '3.8'

services:

  auth-db:
    image: postgres:15-alpine
    container_name: bank-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bank-keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://auth-db:5432/auth_db
      - KC_DB_USERNAME=user
      - KC_DB_PASSWORD=password
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8084:8080"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - bank-network

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"
    networks:
      - bank-network

  deposit-db:
    image: postgres:15-alpine
    container_name: bank-postgres-deposit
    environment:
      POSTGRES_DB: deposit_db
      POSTGRES_USER: deposit_user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deposit_user -d deposit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  config-server:
    build: ./infrastructure/config-server
    container_name: bank-config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  eureka-server:
    build: ./infrastructure/eureka-server
    container_name: bank-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://bank-config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - bank-network


  deposit-service:
    build: ./deposit-service
    container_name: bank-deposit-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://bank-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://bank-eureka-server:8761/eureka/
    depends_on:
      deposit-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - bank-network

  api-gateway:
    build: ./api-gateway
    container_name: bank-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://bank-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://bank-eureka-server:8761/eureka/
    restart: on-failure
    depends_on:
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bank-network

volumes:
  postgres_auth_data:
  postgres_deposit_data:

networks:
  bank-network:
    driver: bridge